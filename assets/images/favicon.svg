<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3836" />
      <stop offset="100%" stop-color="#062322" />
    </linearGradient>

    <!-- Emerald Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Page Shadow -->
    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Tile (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Hardcover Book (Tilted 3D look) -->
  <g filter="url(#pageShadow)">
    <!-- Book Back Cover / Shadow -->
    <rect x="14" y="11" width="36" height="42" rx="3" fill="#071918" />

    <!-- Paper Pages Block (Stacked cream pages on right & bottom) -->
    <rect x="16" y="12" width="33" height="40" rx="2" fill="#F4EDE0" />
    <!-- Page lines texture -->
    <line x1="48" y1="14" x2="48" y2="50" stroke="#DCD3C1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="46" y1="14" x2="46" y2="50" stroke="#EAE2D2" stroke-width="1" />

    <!-- Book Front Cover -->
    <path d="M14 11 C14 11 16 11 20 11.5 L46 11.5 C47.5 11.5 48.5 12.5 48.5 14 L48.5 49 C48.5 50 47.5 51 46 51 L20 51 C16 50.5 14 50.5 14 50.5 Z" fill="#134E4A" />

    <!-- Spine Binding (Left vertical band) -->
    <path d="M14 11 C14 11 15 11 17 11.2 L17 50.8 C15 50.6 14 50.5 14 50.5 Z" fill="#0A2D2B" />
    <!-- Spine Hinge Crease -->
    <line x1="17.5" y1="11.2" x2="17.5" y2="50.8" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
    <line x1="18.5" y1="11.3" x2="18.5" y2="50.7" stroke="rgba(0,0,0,0.3)" stroke-width="0.8" />

    <!-- Gold Foil Decorative Ribs on Spine -->
    <line x1="14" y1="17" x2="17" y2="17.2" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="23" x2="17" y2="23.2" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="39" x2="17" y2="39.2" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="14" y1="45" x2="17" y2="45.2" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cover Gold Foil Cartouche / Emblem -->
    <rect x="24" y="21" width="18" height="20" rx="2" fill="rgba(0,0,0,0.18)" stroke="url(#goldGrad)" stroke-width="1" />
    <!-- Open Book glyph inside cartouche -->
    <path d="M27 28 C29 27 32 27.5 33 29 C34 27.5 37 27 39 28 L39 35 C37 34 34 34.5 33 36 C32 34.5 29 34 27 35 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <line x1="33" y1="29" x2="33" y2="36" stroke="#134E4A" stroke-width="0.8" />

    <!-- Silk Bookmark Ribbon hanging from bottom -->
    <path d="M36 49 L36 57 L39 54.5 L42 57 L42 49 Z" fill="url(#ribbonGrad)" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.3))" />
  </g>
</svg>
